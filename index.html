<!doctype html>
<html lang="PT-BR">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, shrink-to-fit=no"
		/>
		<title>Lyam portfólio</title>

		<!--? ==================== CDN ==================== -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
			integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		/>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
			crossorigin="anonymous"
		></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<!--? ==================== OUTROS ==================== -->
		<link rel="stylesheet" href="styles/style.css" />
		<link
			href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Bagel+Fat+One&family=Delius&family=Mali:wght@300;400;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" type="image/png" sizes="32x32" href="img/siteIcon.png" />
	</head>

	<body>
		<!--? ==================== HEADER ==================== -->
		<div id="header-container" class="container">
			<header class="row">
				<a class="fs-4 col-6 logo redish-text" href="#index">
					<img
						height="35px"
						width="35px"
						id="site-icon"
						src="img/siteIcon.png"
						alt="Assinatura da Lyam como logo do portfólio"
				/></a>
				<nav class="col-6" role="navigation">
					<ul class="nav justify-content-end">
						<li class="nav-item">
							<select id="language-switcher">
								<option value="ptBR" selected>Português</option>
								<option value="en">English</option>
							</select>
						</li>
						<li class="nav-item">
							<a
								class="fs-4 nav-link redish-text"
								id="linkedin"
								target="_blank"
								rel="noopener noreferrer"
								aria-label="LinkedIn de Lyam Santos Peres"
								href="https://www.linkedin.com/in/lyamoe/"
							>
								<i class="fa-brands fa-linkedin-in"></i>
							</a>
						</li>
						<li class="nav-item">
							<a
								class="fs-4 nav-link redish-text"
								id="email"
								target="_blank"
								rel="noopener noreferrer"
								aria-label="Enviar e-mail para Lyam Santos Peres"
								href="https://mail.google.com/mail/?view=cm&to=lyamoesp@gmail.com&su=Contate%20Lyam&body=Eu%20vi%20seu%20portfólio."
								><i class="fa-solid fa-envelope"></i
							></a>
						</li>
					</ul>
				</nav>
			</header>
		</div>
		<!--? ==================== SCREEN 1 - INDEX ==================== -->
		<main id="index" class="container w-100">
			<article id="intro" class="row align-items-center h-80vh">
				<section id="greet">
					<div
						class="rounded-circle text-center d-flex flex-column align-items-center justify-content-center index-circle"
					>
						<h1 id="intro-title">Aqui é a Lyam!</h1>
						<h2 id="subtitle">Game e Web Dev</h2>
					</div>
				</section>
				<section
					class="buttons d-flex gap-3 flex-wrap justify-content-center mt-5 mb-3"
				>
					<a
						class="page-control btn redish-text redish-border-1px btn-responsive rounded-start-5 me-2"
						id="about-btn"
						href="pages/about.html"
					>
						Sobre
					</a>
					<a
						class="page-control btn redish-text redish-border-1px btn-responsive rounded-end-5 ms-2"
						id="projects-btn"
						href="pages/projects.html"
					>
						Projetos
					</a>
				</section>
			</article>
		</main>
		<!--? ==================== FOOTER ==================== -->
		<footer class="text-center">
			<address class="redish-text">
				<p id="copyright">Portfólio por © Lyamoe</p>
				<p id="call-to-contact">Entre em contato!</p>
			</address>
		</footer>
		<!--? ==================== SCRIPTS ==================== -->
		<script type="module">
			import { initLanguageController } from "./scripts/setLanguage.js";

			document.addEventListener("DOMContentLoaded", () => {
				initLanguageController("index");
			});
		</script>
	</body>
</html>
